name: Build IPA from your own Spotify IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct link to a decrypted Spotify IPA"
        required: true
        type: string
      project_path:
        description: "Path to the directory that contains your Makefile (relative to repo root)"
        required: false
        default: "."
        type: string
      upload_method:
        description: "Where to put the result"
        default: artifacts
        type: choice
        options: [artifacts, filebin, both]

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: levibostian/action-hide-sensitive-inputs@v1

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.2.1'

      - uses: actions/checkout@v5
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install tools
        run: |
          brew install make dpkg ldid
          python3 -m pip install --break-system-packages git+https://github.com/asdfzxcvbn/pyzule-rw.git

      - name: Download IPA
        run: |
          mkdir -p ipa
          curl -fsSL "${{ inputs.ipa_url }}" -o ipa/spotify.ipa
          case "$(file --mime-type -b ipa/spotify.ipa)" in application/zip|application/x-ios-app) ;; *) echo "::error::Not an IPA"; exit 1 ;; esac

      - name: Build with Theos
        run: |
          set -euo pipefail
          echo "Working dir: $(pwd)"
          ls -la

          SEARCH_ROOT="${{ inputs.project_path || '.' }}"
          MF=$(find "$SEARCH_ROOT" -maxdepth 8 -type f -name Makefile -print -quit || true)

          if [ -z "$MF" ]; then
            echo "::error::No Makefile found in '$SEARCH_ROOT'. Ensure your Theos project is in the repo or update workflow input 'project_path'."
            exit 1
          fi

          MDIR=$(dirname "$MF")
          echo "Found Makefile at $MF, running 'make release' in $MDIR"
          cd "$MDIR"

          mkdir -p "$GITHUB_WORKSPACE/build-logs"
          make_ret=0

          if make -n release >/dev/null 2>&1; then
            make release CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES 2>&1 | tee "$GITHUB_WORKSPACE/build-logs/make-release.log"
            make_ret=${PIPESTATUS[0]}
          else
            echo "::warning::'release' target not found, attempting 'package' fallback and showing diagnostics."
            sed -n '1,200p' Makefile || true
            if make -n package >/dev/null 2>&1; then
              make package CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES 2>&1 | tee "$GITHUB_WORKSPACE/build-logs/make-package.log"
              make_ret=${PIPESTATUS[0]}
            else
              echo "::error::No suitable build target found (neither 'release' nor 'package'). Update the Makefile or the workflow."
              exit 1
            fi
          fi

          if [ "$make_ret" -ne 0 ]; then
            echo "::error::Make failed, see build-logs/ for details"
            exit "$make_ret"
          fi

      - uses: actions/upload-artifact@v5
        if: inputs.upload_method != 'filebin'
        with:
          name: spoti.ipa
          path: out/*.ipa
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-logs
          path: build-logs/*
          if-no-files-found: ignore

      - name: Upload to filebin.net
        if: inputs.upload_method != 'artifacts'
        run: |
          BIN="spotifyglass-${{ github.run_id }}"
          echo "### filebin.net download" >> "$GITHUB_STEP_SUMMARY"
          for f in out/*.ipa; do
            curl -fsS -X POST -H "Content-Type: application/octet-stream" --data-binary "@$f" "https://filebin.net/$BIN/$(basename "$f")" >/dev/null
            echo "- https://filebin.net/$BIN/$(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "- _filebin deletes bins after a few days of inactivity, download promptly._" >> "$GITHUB_STEP_SUMMARY"
